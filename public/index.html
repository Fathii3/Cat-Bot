<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat-Bot AI Service · Fathi Fadhil</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      color: #fafafa;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 1.5rem;
      padding: 2.5rem;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #059669;
      color: #34d399;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
    }
    p {
      color: #a1a1aa;
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0 0 1.5rem 0;
    }
    a {
      color: #10b981;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      border-bottom: 1px dashed #10b981;
    }
    a:hover {
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">

    <h1>🐱 Cat-Bot (Neko) API</h1>

    </p>

      Buka Portofolio fathifadhil.me &rarr;
    </a>
  </div>
</body>
</html>
